name: quiz_covid19
description: An offline educational COVID-19 quiz with sourced questions and accessible feedback.
publish_to: none
version: 2.0.0+2

environment:
  sdk: '>=3.14.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  material_ui: ^1.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/LICENSE.txt
  fonts:
    - family: QuizRoboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
